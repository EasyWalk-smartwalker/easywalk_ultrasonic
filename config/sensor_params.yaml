decision_node:
  ros__parameters:
    # Porta seriale Arduino
    serial_port: '/dev/ttyACM0'
    baud_rate: 57600

    # Distanze soglia (cm)
    stop_distance: 50.0
    warn_distance: 80.0
    side_distance: 60.0
    drop_threshold: 8.0
    bottom_valid_max: 40.0

    # Isteresi
    stop_hysteresis: 2.0
    warn_hysteresis: 2.0
    steer_margin: 15.0

    # Posizioni sensori rispetto a base_link (metri)
    sensors:
      L30: [0.075,  0.07,  -0.108]
      L15: [0.065,  0.08,   0.015]
      CTR: [0.07,   0.0,   -0.045]
      R15: [0.065, -0.08,   0.015]
      R30: [0.075, -0.07,  -0.108]
      BOT: [0.0,    0.0,   -0.07 ]
