# Calibrazione dei 6 HC-SR04 letta da serial_publisher.
# Valori NEUTRI (nessuna correzione): sostituirli con i risultati della
# procedura di calibrazione (paper/protocol/protocollo_sperimentale.tex,
# Sez. "Calibrazione dei sensori a ultrasuoni", S2-S5).
#
#   temperature_c : temperatura della sessione (S2), c = 331.3 + 0.606 T
#   gain, offset_m: d_cal = gain * d + offset_m (S3)
#   fov_rad       : apertura totale del cono misurata, 2 * theta50 (S4)
#   min_range_m   : sotto questa distanza la lettura diventa -inf (S3)
#   max_range_m   : oltre questa distanza la lettura diventa +inf (S3);
#                   deve restare <= c * fw_timeout_us / 2
#   fw_*          : configurazione inviata al firmware all'avvio (S5)
#
# Calibrazione eseguita il: <data>    firmware commit: <hash>
serial_publisher:
  ros__parameters:
    serial_port: /dev/ttyACM0
    baud_rate: 115200
    temperature_c: 20.0

    configure_firmware: true
    fw_mode: ring              # ring | single
    fw_single_sensor: 2        # indice (0 L30, 1 L15, 2 CTR, 3 R15, 4 R30, 5 BOT)
    fw_order: [0, 3, 2, 1, 4, 5]
    fw_inter_ping_delay_ms: 0
    fw_cycle_delay_ms: 20
    fw_timeout_us: 15000
    fw_min_sensor_period_ms: 60   # tra due ping dello STESSO sensore (datasheet: >= 60 ms)

    L30: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    L15: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    CTR: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    R15: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    R30: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    BOT: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
