# Calibration of the 6 HC-SR04, read by serial_publisher (via sonar_launch.py).
# NEUTRAL values (no correction): replace them with the results of the
# calibration procedure (paper/protocol/primi_passi_sonar.pdf, or
# paper/protocol/protocollo_sperimentale.tex, section "Calibrazione dei sensori
# a ultrasuoni", S2-S5). Rebuild the package after editing this file.
#
#   temperature_c : temperature of the session (S2), c = 331.3 + 0.606 T
#   gain, offset_m: d_cal = gain * d + offset_m (S3)
#   fov_rad       : measured full cone aperture, 2 * theta50 (S4)
#   min_range_m   : readings below this distance become -inf (S3)
#   max_range_m   : readings beyond this distance become +inf (S3);
#                   must stay <= c * fw_timeout_us / 2
#   fw_*          : configuration sent to the firmware at startup (S5)
#
# Calibration done on: <date>    firmware commit: <hash>
serial_publisher:
  ros__parameters:
    serial_port: /dev/ttyACM0
    baud_rate: 115200
    temperature_c: 20.0

    configure_firmware: true
    fw_mode: ring              # ring | single
    fw_single_sensor: 2        # index (0 L30, 1 L15, 2 CTR, 3 R15, 4 R30, 5 BOT)
    fw_order: [0, 3, 2, 1, 4, 5]   # alternates sides to reduce crosstalk
    fw_inter_ping_delay_ms: 0      # pause between two consecutive pings
    fw_cycle_delay_ms: 20          # pause at the end of each cycle
    fw_timeout_us: 15000           # echo timeout (~2.5 m)
    fw_min_sensor_period_ms: 60    # between two pings of the SAME sensor (datasheet: >= 60 ms)

    L30: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    L15: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    CTR: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    R15: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    R30: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
    BOT: {gain: 1.0, offset_m: 0.0, fov_rad: 0.26, min_range_m: 0.03, max_range_m: 2.5}
